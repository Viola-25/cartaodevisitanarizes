# .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  # Roda quando um push é feito para a branch 'main'
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    permissions:
      contents: write # Permissão para a action fazer push para a branch gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # A branch que o GitHub Pages usará
          folder: . # A pasta raiz do seu projeto