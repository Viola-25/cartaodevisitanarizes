<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipbook - Trajetória</title>
  <link rel="icon" href="data:," />
  <style>
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;overflow:hidden}
    body{background:linear-gradient(135deg, #d4cac3 0%, #e8dfd9 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px}
    .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 12px}
    .btn{background:#E74C3C;color:#fff;padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:0.9em}
    .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 8px rgba(0,0,0,0.15)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .controls{display:flex;gap:8px}
    #status{font-size:0.9em;color:#333;font-weight:600;white-space:nowrap}
    .book-wrap{width:100%;flex:1;perspective:2000px;display:flex;align-items:center;justify-content:center}
    .book{display:flex;gap:12px;transform-style:preserve-3d;box-shadow:0 25px 50px rgba(0,0,0,0.4)}
    .page-col{width:340px;height:450px;background:#fff;border-radius:1px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;transform-style:preserve-3d}
    .page-col canvas{width:100%;height:100%;display:block;object-fit:contain}
    .page-col.left{transform:rotateY(12deg);box-shadow:-12px 0 20px rgba(0,0,0,0.15)}
    .page-col.right{transform:rotateY(-12deg);box-shadow:12px 0 20px rgba(0,0,0,0.15)}
    .page-col.animate-in{animation:flipInPage 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards}
    .spine{width:6px;background:linear-gradient(90deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0.2) 100%);height:100%}
    @keyframes flipInPage{
      0%{transform:rotateY(90deg);opacity:0}
      50%{opacity:0.5}
      100%{transform:rotateY(0deg) rotateY(var(--final-angle, 0deg));opacity:1}
    }
    @media(max-width:1100px){
      .page-col{width:300px;height:400px}
      .gap{gap:8px}
    }
    @media(max-width:700px){
      .page-col{width:85vw;height:113vw;max-height:95vh}
      .page-col.left,.page-col.right{margin:0;transform:rotateY(0deg);box-shadow:0 4px 8px rgba(0,0,0,0.15)}
      .spine{display:none}
      .book{gap:0;flex-direction:column}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="controls">
      <button id="back" class="btn">← Voltar</button>
      <button id="prev" class="btn">◀ Anterior</button>
      <button id="next" class="btn">Próxima ▶</button>
    </div>
    <div id="status">Carregando...</div>
    <div class="controls">
      <button id="fullscreen" class="btn" style="background:#555">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="book-wrap">
    <div class="book">
      <div class="page-col left" id="leftPage"><canvas></canvas></div>
      <div class="spine"></div>
      <div class="page-col right" id="rightPage"><canvas></canvas></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('pdf') ? decodeURIComponent(params.get('pdf')) : null;
    const status = document.getElementById('status');
    const leftCanvas = document.querySelector('#leftPage canvas');
    const rightCanvas = document.querySelector('#rightPage canvas');
    let pdfDoc = null;
    let leftPageNum = 1;
    let rightPageNum = 2;

    if (!pdfUrl) { status.innerText = 'PDF não fornecido.'; document.getElementById('next').disabled = true; document.getElementById('prev').disabled = true; }

    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    async function renderPage(pageNum, canvas) {
      if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;
      const page = await pdfDoc.getPage(pageNum);
      const scale = 1.2;
      const viewport = page.getViewport({scale});
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    }

    async function showSpread(leftPage, rightPage) {
      if (!pdfDoc) return;
      leftPageNum = Math.max(1, leftPage);
      rightPageNum = Math.min(pdfDoc.numPages, rightPage);
      if (leftPageNum > pdfDoc.numPages) return;
      
      // Add flip animation
      document.getElementById('leftPage').classList.add('animate-in');
      document.getElementById('rightPage').classList.add('animate-in');
      
      await renderPage(leftPageNum, leftCanvas);
      if (rightPageNum <= pdfDoc.numPages) {
        await renderPage(rightPageNum, rightCanvas);
      } else {
        rightCanvas.width = 0; rightCanvas.height = 0;
      }
      status.innerText = `Páginas ${leftPageNum}–${Math.min(rightPageNum, pdfDoc.numPages)} de ${pdfDoc.numPages}`;
      document.getElementById('prev').disabled = leftPageNum <= 1;
      document.getElementById('next').disabled = rightPageNum >= pdfDoc.numPages;
      
      // Remove animation class after animation completes
      setTimeout(() => {
        document.getElementById('leftPage').classList.remove('animate-in');
        document.getElementById('rightPage').classList.remove('animate-in');
      }, 800);
    }

    (async function(){
      try {
        status.innerText = 'Carregando PDF...';
        const task = pdfjsLib.getDocument({url: pdfUrl, withCredentials:false});
        pdfDoc = await task.promise;
        await showSpread(1, 2);
      } catch(err) {
        console.error(err);
        status.innerText = `Erro: ${err.message || 'falha ao carregar PDF'}`;
      }
    })();

    document.getElementById('prev').addEventListener('click', () => showSpread(leftPageNum - 2, rightPageNum - 2));
    document.getElementById('next').addEventListener('click', () => showSpread(leftPageNum + 2, rightPageNum + 2));
    document.getElementById('back').addEventListener('click', () => window.close());
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(()=>{});
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') document.getElementById('prev').click();
      if (e.key === 'ArrowRight') document.getElementById('next').click();
      if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
    });

    // Swipe/drag support
    let startX = 0;
    document.querySelector('.book-wrap').addEventListener('mousedown', (e) => { startX = e.clientX; });
    document.querySelector('.book-wrap').addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
    document.querySelector('.book-wrap').addEventListener('mouseup', (e) => {
      const diff = e.clientX - startX;
      if (diff > 50) document.getElementById('prev').click();
      if (diff < -50) document.getElementById('next').click();
    });
    document.querySelector('.book-wrap').addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].clientX - startX;
      if (diff > 50) document.getElementById('prev').click();
      if (diff < -50) document.getElementById('next').click();
    });
  </script>
</body>
</html>
