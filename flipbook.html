<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flipbook - Trajetória</title>
  <link rel="icon" href="data:," />
  <style>
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial}
    body{background:#f0ebe6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px}
    .topbar{width:100%;max-width:1200px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .btn{background:#E74C3C;color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
    #flipbook-wrap{width:100%;max-width:1200px;height:80vh;background:#ddd;display:flex;align-items:center;justify-content:center}
    #flipbook{width:90%;height:95%;}
    .loading{font-size:1em;color:#333}
    /* turn.js requires .page elements */
    .page{background-size:cover;background-position:center;background-repeat:no-repeat}
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <button id="back" class="btn">← Voltar</button>
      <button id="fullscreen" class="btn" style="margin-left:8px;background:#444">Fullscreen</button>
    </div>
    <div id="status" class="loading">Preparando...</div>
    <div></div>
  </div>

  <div id="flipbook-wrap">
    <div id="flipbook"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pdfUrlParam = params.get('pdf') || '';
    const pdfUrl = pdfUrlParam ? decodeURIComponent(pdfUrlParam) : null;
    const status = document.getElementById('status');

    if (!pdfUrl) { status.innerText = 'PDF não fornecido.'; }

    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    (async function(){
      try {
        status.innerText = 'Carregando PDF...';
        const loadingTask = pdfjsLib.getDocument({url: pdfUrl, withCredentials:false});
        const pdf = await loadingTask.promise;
        const total = pdf.numPages;
        // Render thumbnails progressively
        status.innerText = `Renderizando ${total} páginas...`;
        for (let i=1;i<=total;i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({scale:1.0});
          const canvas = document.createElement('canvas');
          // scale down to speed up thumbnails
          const scale = Math.max(0.6, Math.min(1.0, 900/viewport.width));
          const v = page.getViewport({scale});
          canvas.width = v.width; canvas.height = v.height;
          await page.render({canvasContext: canvas.getContext('2d'), viewport: v}).promise;
          const data = canvas.toDataURL('image/png');
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.style.width = v.width + 'px';
          pageDiv.style.height = v.height + 'px';
          pageDiv.style.backgroundImage = `url(${data})`;
          document.getElementById('flipbook').appendChild(pageDiv);
          status.innerText = `Renderizando página ${i} / ${total}`;
        }
        // Initialize turn.js
        $('#flipbook').turn({width: '100%', height: '100%', autoCenter: true});
        status.innerText = 'Concluído — use as setas ou arraste para virar páginas.';
      } catch(err) {
        console.error(err);
        status.innerText = 'Erro ao carregar/gerar flipbook.';
      }
    })();

    document.getElementById('back').addEventListener('click', ()=>{ window.close(); });
    document.getElementById('fullscreen').addEventListener('click', ()=>{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); });
  </script>
</body>
</html>
